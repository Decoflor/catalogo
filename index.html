<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#C1415A">
<title>Hermanas DecoFlor · Catálogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'Jost',sans-serif;background:#F9F4EF;color:#2C1F1F;min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit;cursor:pointer;touch-action:manipulation}
img{display:block;max-width:100%;object-fit:cover}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(249,244,239,.96);border-bottom:1px solid rgba(201,135,90,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.logo{display:flex;flex-direction:column;cursor:default;user-select:none}
.logo-top{font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:#C9875A;font-weight:600}
.logo-name{font-family:'Cormorant Garamond',serif;font-size:20px;color:#2C1F1F;font-weight:600;line-height:1.1}
.hdr-wa{display:flex;align-items:center;gap:6px;background:#25D366;color:#fff;padding:8px 14px;border-radius:50px;font-size:12px;font-weight:600}
.hdr-wa svg{width:14px;height:14px;fill:#fff;flex-shrink:0}

/* HERO */
.hero{background:linear-gradient(135deg,#2C1F1F 0%,#3d2a2a 50%,#2C1F1F 100%);padding:60px 20px 50px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,135,90,.15) 0%,transparent 70%)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(201,135,90,.2);border:1px solid rgba(201,135,90,.4);color:#f5d8c4;padding:5px 14px;border-radius:30px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;margin-bottom:18px}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,9vw,62px);color:#fff;line-height:1.05;margin-bottom:10px;font-weight:300}
.hero-title em{font-style:italic;color:#C9875A}
.hero-sub{color:rgba(255,255,255,.55);font-size:13px;font-weight:300;line-height:1.6}

/* GRID */
.section{max-width:1100px;margin:0 auto;padding:32px 14px 80px}
.section-title{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#C9875A;font-weight:600;margin-bottom:22px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

/* CATALOG CARD */
.cat-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(44,31,31,.09);display:flex;flex-direction:column;transition:transform .22s,box-shadow .22s;cursor:pointer;touch-action:manipulation}
.cat-card:active{transform:scale(.97)}
@media(hover:hover){.cat-card:hover{transform:translateY(-4px);box-shadow:0 18px 50px rgba(44,31,31,.15)}}
.cat-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(135deg,#f0e0d6,#e8cfc0)}
.cat-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.cat-card:active .cat-img img{transform:scale(1.04)}
.cat-badge{position:absolute;top:10px;left:10px;background:#C1415A;color:#fff;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px}
.cat-body{padding:14px;flex:1;display:flex;flex-direction:column;gap:5px}
.cat-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#C9875A;font-weight:600}
.cat-name{font-family:'Cormorant Garamond',serif;font-size:17px;color:#2C1F1F;line-height:1.2;font-weight:600}
.cat-desc{font-size:11px;color:#7A5C5C;line-height:1.5;font-style:italic;flex:1}
.cat-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.cat-range{font-family:'Cormorant Garamond',serif;font-size:13px;color:#7A5C5C;font-weight:500}
.cat-btn{background:#C1415A;color:#fff;padding:7px 14px;border-radius:50px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* FAB WA */
.fab{position:fixed;bottom:20px;right:16px;z-index:200;width:52px;height:52px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(37,211,102,.42);animation:fp 2.4s infinite}
@keyframes fp{0%,100%{box-shadow:0 6px 20px rgba(37,211,102,.42)}50%{box-shadow:0 6px 28px rgba(37,211,102,.65)}}
.fab svg{width:26px;height:26px;fill:#fff}

/* FOOTER */
.ftr{background:#2C1F1F;color:rgba(255,255,255,.55);text-align:center;padding:36px 20px 28px}
.ftr-logo{font-family:'Cormorant Garamond',serif;font-size:26px;color:#fff;margin-bottom:2px}
.ftr-sub{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#C9875A;margin-bottom:16px}
.ftr-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.ftr-links a{color:rgba(255,255,255,.5);font-size:13px;touch-action:manipulation}
.ftr-copy{font-size:10px;color:rgba(255,255,255,.2)}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <span class="logo-top">Hermanas</span>
    <span class="logo-name">DecoFlor</span>
  </div>
  <a class="hdr-wa" id="hdrWa" href="https://wa.me/18293802507?text=Hola%2C+quiero+ver+los+cat%C3%A1logos+de+DecoFlor+%F0%9F%8C%B8">
    <svg viewBox="0 0 32 32"><path d="M16 2a14 14 0 0 0-12.14 20.9L2 30l7.27-1.83A14 14 0 1 0 16 2zm6.31 19.86c-.34-.17-2.02-1-2.34-1.11-.31-.11-.54-.17-.77.17s-.88 1.11-1.08 1.34-.4.25-.74.08a9.37 9.37 0 0 1-2.74-1.69 10.28 10.28 0 0 1-1.9-2.36c-.2-.34 0-.52.15-.69s.34-.4.51-.6.23-.4.34-.57a.63.63 0 0 0 0-.6c-.08-.17-.77-1.85-1.06-2.53s-.56-.57-.77-.58h-.65a1.26 1.26 0 0 0-.91.42 3.83 3.83 0 0 0-1.19 2.84 6.64 6.64 0 0 0 1.39 3.52 15.26 15.26 0 0 0 5.84 5.15 16.82 16.82 0 0 0 1.95.72 4.69 4.69 0 0 0 2.15.14 3.52 3.52 0 0 0 2.31-1.62 2.86 2.86 0 0 0 .2-1.62c-.08-.14-.31-.22-.65-.39z"/></svg>
    829-380-2507
  </a>
</header>

<div class="hero">
  <div class="hero-badge">🌸 Hermanas DecoFlor · Est. 2020</div>
  <h1 class="hero-title">Nuestros<br><em>Catálogos</em></h1>
  <p class="hero-sub">Elige el catálogo que necesitas o explóralos todos</p>
</div>

<div class="section">
  <div class="section-title">Selecciona una colección</div>
  <div class="grid" id="catalogGrid"></div>
</div>

<footer class="ftr">
  <div class="ftr-logo">DecoFlor</div>
  <div class="ftr-sub">Hermanas · Tu Floristería</div>
  <div class="ftr-links">
    <a id="ftWa" href="https://wa.me/18293802507">📲 829-380-2507</a>
    <a href="https://instagram.com/hermanasdecoflor" target="_blank">📸 @HermanasDecoflor</a>
  </div>
  <p class="ftr-copy">© 2026 Hermanas DecoFlor · Todos los derechos reservados</p>
</footer>

<a class="fab" id="fabWa" href="https://wa.me/18293802507?text=Hola%2C+quiero+consultar+sobre+sus+cat%C3%A1logos+%F0%9F%8C%B8" aria-label="WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16 2a14 14 0 0 0-12.14 20.9L2 30l7.27-1.83A14 14 0 1 0 16 2zm6.31 19.86c-.34-.17-2.02-1-2.34-1.11-.31-.11-.54-.17-.77.17s-.88 1.11-1.08 1.34-.4.25-.74.08a9.37 9.37 0 0 1-2.74-1.69 10.28 10.28 0 0 1-1.9-2.36c-.2-.34 0-.52.15-.69s.34-.4.51-.6.23-.4.34-.57a.63.63 0 0 0 0-.6c-.08-.17-.77-1.85-1.06-2.53s-.56-.57-.77-.58h-.65a1.26 1.26 0 0 0-.91.42 3.83 3.83 0 0 0-1.19 2.84 6.64 6.64 0 0 0 1.39 3.52 15.26 15.26 0 0 0 5.84 5.15 16.82 16.82 0 0 0 1.95.72 4.69 4.69 0 0 0 2.15.14 3.52 3.52 0 0 0 2.31-1.62 2.86 2.86 0 0 0 .2-1.62c-.08-.14-.31-.22-.65-.39z"/></svg>
</a>

<script>
var CATALOGS = [
  {
    id:'flores',
    name:'Flores & Ramos',
    label:'Catálogo Principal',
    desc:'Ramos, arreglos, orquídeas y composiciones florales para toda ocasión.',
    range:'RD$ 2,200 – RD$ 39,500',
    badge:'⭐ Popular',
    img:'https://images.unsplash.com/photo-1490750967868-88df5691cc88?q=80&w=600&fit=crop',
    file:'flores.html'
  },
  {
    id:'hombres',
    name:'Arreglos para Él',
    label:'Colección Masculina',
    desc:'Detalles especiales y arreglos elegantes diseñados para sorprender a los hombres especiales.',
    range:'RD$ 3,500 – RD$ 18,000',
    badge:'',
    img:'https://images.unsplash.com/photo-1464305795204-6f5bbfc7fb81?q=80&w=600&fit=crop',
    file:'hombres.html'
  },
  {
    id:'funerarios',
    name:'Arreglos Fúnebres',
    label:'Condolencias',
    desc:'Coronas, cruces y arreglos florales para expresar nuestro respeto y condolencias.',
    range:'RD$ 4,000 – RD$ 25,000',
    badge:'',
    img:'https://images.unsplash.com/photo-1471919743851-c4df8b6ee133?q=80&w=600&fit=crop',
    file:'funerarios.html'
  },
  {
    id:'desayunos',
    name:'Desayunos Gourmet',
    label:'Desayunos & Detalles',
    desc:'Bandejas gourmet, desayunos premium y cajas sorpresa para celebrar momentos especiales.',
    range:'RD$ 3,500 – RD$ 12,000',
    badge:'🥐 Nuevo',
    img:'https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?q=80&w=600&fit=crop',
    file:'desayunos.html'
  },
  {
    id:'eventos',
    name:'Decoración de Eventos',
    label:'Eventos & Bodas',
    desc:'Centros de mesa, arcos florales y decoración completa para bodas, quinceañeras y eventos.',
    range:'Consultar precio',
    badge:'',
    img:'https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=600&fit=crop',
    file:'eventos.html'
  },
  {
    id:'plantas',
    name:'Plantas & Macetas',
    label:'Plantas Naturales',
    desc:'Plantas decorativas, suculentas, orquídeas en maceta y arreglos de plantas para el hogar.',
    range:'RD$ 1,500 – RD$ 15,000',
    badge:'',
    img:'https://images.unsplash.com/photo-1512428813834-c702c7702b78?q=80&w=600&fit=crop',
    file:'plantas.html'
  }
];

function buildGrid(){
  var grid=document.getElementById('catalogGrid');
  grid.innerHTML='';
  CATALOGS.forEach(function(c){
    var card=document.createElement('a');
    card.href=c.file;
    card.className='cat-card';
    card.innerHTML=
      '<div class="cat-img">'+(c.badge?'<div class="cat-badge">'+c.badge+'</div>':'')+
      '<img src="'+c.img+'" alt="'+c.name+'" loading="lazy"></div>'+
      '<div class="cat-body">'+
      '<div class="cat-label">'+c.label+'</div>'+
      '<div class="cat-name">'+c.name+'</div>'+
      '<div class="cat-desc">'+c.desc+'</div>'+
      '<div class="cat-foot">'+
      '<div class="cat-range">'+c.range+'</div>'+
      '<div class="cat-btn">Ver</div>'+
      '</div></div>';
    grid.appendChild(card);
  });
}

buildGrid();
</script>
</body>
</html>
